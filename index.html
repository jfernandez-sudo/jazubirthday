   3) UTILIDADES
   ========================================================================== */
function scallopedPath(cx, cy, rx, ry, bumps, depth) {
  const pts = [];
  const steps = bumps * 8;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    const wobble = 1 + depth * Math.sin(a * bumps);
    const x = cx + rx * wobble * Math.cos(a);
    const y = cy + ry * wobble * Math.sin(a);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return `M ${pts.join(" L ")} Z`;
}

function useCountdown(targetISO) {
  const [left, setLeft] = useState(() => Math.max(0, new Date(targetISO) - new Date()));
  useEffect(() => {
    const t = setInterval(() => {
      setLeft(Math.max(0, new Date(targetISO) - new Date()));
    }, 1000);
    return () => clearInterval(t);
  }, [targetISO]);
  const s = Math.floor(left / 1000);
  return {
    dias: Math.floor(s / 86400),
    horas: Math.floor((s % 86400) / 3600),
    min: Math.floor((s % 3600) / 60),
    seg: s % 60,
    llego: left <= 0,
  };
}

function useReveal() {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setShown(true);
          obs.disconnect();
        }
      },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, shown];
}

            transform={`rotate(${deg} 60 60)`}

        <circle cx="60" cy="60" r="3" fill={THEME.brick} opacity="0.6" />
      </g>
    </svg>
  );
}

function Reveal({ children, className = "", delay = 0 }) {
  const [ref, shown] = useReveal();
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? "translateY(0px)" : "translateY(24px)",
        transition: `opacity 0.8s ease ${delay}ms, transform 0.8s ease ${delay}ms`,
      }}
    >
      {children}
    </div>
  );
}

function ScallopFrame({ size = 320, children }) {
  const cx = size / 2,
    cy = size / 2 * 1.25;
  const path = scallopedPath(cx, cy, size * 0.46, size * 0.58, 18, 0.045);
  return (
    <div style={{ position: "relative", width: size, height: size * 1.25, maxWidth: "88vw" }}>
      <svg
        viewBox={`0 0 ${size} ${size * 1.25}`}
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}
      >
        <path d={path} fill={THEME.cream} stroke={THEME.maroon} strokeWidth="3" />
      </svg>
      <div
        style={{
          position: "absolute",
          inset: "10%",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          textAlign: "center",
        }}
      >
        {children}
      </div>
    </div>
  );
}

function InvitacionCumpleanos() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {

    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div style={{ fontFamily: FONT_BODY }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Quicksand:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        input::placeholder, textarea::placeholder { color: ${THEME.inkSoft}; opacity: 0.6; }
        input:focus, textarea:focus { outline: 2px solid ${THEME.brick}; }
      `}</style>

      <AntesDeVenir />
      <FAQ />
      <Cierre />
    </div>
  );
}
